name: Deploy Builder

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            environment:
                description: '部署环境'
                required: true
                default: 'production'
                type: choice
                options:
                    - production
                    - staging

permissions:
    contents: read

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

env:
    APP_NAME: n-builder
    DIST_DIR: apps/builder/dist
    REMOTE_DIST: /home/ubuntu/builder-dist

jobs:
    build:
        name: 构建前端
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 代码
              uses: actions/checkout@v4

            - name: Setup Node.js + pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: 获取 pnpm store 路径
              id: pnpm-cache
              run: echo "store_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

            - name: 启用 pnpm store 缓存
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.store_dir }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check & build
              run: pnpm --filter ${{ env.APP_NAME }} build

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: builder-dist
                  path: ${{ env.DIST_DIR }}
                  retention-days: 1
                  if-no-files-found: error

    deploy:
        name: 部署到服务器
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: production
            url: https://builder.ningzhi2.site
        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: builder-dist
                  path: dist

            - name: 打包产物为 tar（存于 workspace 内供 SCP 容器访问）
              run: |
                tar czf builder-dist.tar.gz -C dist .
                echo "打包完成，文件列表："
                tar tzf builder-dist.tar.gz | head -10
                ls -lh builder-dist.tar.gz

            - name: 同步 tar 到服务器
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                port: ${{ secrets.SSH_PORT || 22 }}
                source: 'builder-dist.tar.gz'
                target: '/tmp/deploy'
                overwrite: true

            - name: 解压部署 + 重载 Caddy + 健康检查
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT || 22 }}
                  script: |
                      set -e

                      # 1. 清空目标目录内容（保留目录本身）
                      echo "清理旧产物..."
                      find ${{ env.REMOTE_DIST }} -mindepth 1 -delete 2>/dev/null || true

                      # 2. 解压新产物（. 表示 dist 目录内容本身，不含 dist 层级）
                      echo "解压新产物到 ${{ env.REMOTE_DIST }}..."
                      tar xzf /tmp/deploy/builder-dist.tar.gz -C ${{ env.REMOTE_DIST }}
                      rm -f /tmp/deploy/builder-dist.tar.gz

                      # 3. 验证文件是否就位
                      echo "文件清单："
                      ls -la ${{ env.REMOTE_DIST }} | head -10
                      if [ ! -f "${{ env.REMOTE_DIST }}/index.html" ]; then
                        echo "❌ index.html 不存在！"
                        exit 1
                      fi

                      # 4. 找到现有 Caddy 容器并重载
                      CADDY_CID=$(docker ps --filter ancestor=caddy -q | head -1)
                      if [ -z "$CADDY_CID" ]; then
                        echo "❌ 未找到运行中的 Caddy 容器"
                        exit 1
                      fi
                      echo "Caddy 容器: $CADDY_CID"

                      # 5. 验证容器内挂载
                      echo "容器内 builder 目录："
                      docker exec "$CADDY_CID" ls -la /app/frontend/builder/dist/ 2>&1 | head -5

                      # 6. 重载 Caddy（零停机）
                      docker exec "$CADDY_CID" caddy reload --config /etc/caddy/Caddyfile
                      echo "✅ Caddy 重载成功"

                      # 7. 健康检查
                      sleep 2
                      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ -H "Host: builder.ningzhi2.site")
                      echo "HTTP 响应码: $HTTP_CODE"
                      if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "308" ]; then
                        echo "⚠️  本地访问异常，尝试 HTTPS..."
                        HTTP_CODE2=$(curl -sk -o /dev/null -w "%{http_code}" https://builder.ningzhi2.site)
                        echo "HTTPS 响应码: $HTTP_CODE2"
                      else
                        echo "✅ 部署成功！"
                      fi
